name: 构建

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本号（例如 v0.1.0，需与 android/version.properties 一致），留空则只构建不发布"
        required: false
        default: ""

env:
  # 微软登录使用的 Azure 应用 Client ID（公开信息，不是密钥），与电脑版相同
  REDCRAFT_MS_CLIENT_ID: 3b8bb0ce-d514-42fe-83b6-bb374eb8b665

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: 打包 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Android SDK 与 NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: red_craft

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: red_craft/pnpm-lock.yaml

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.RCL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rcl.jks"
            echo "RCL_KEYSTORE=$RUNNER_TEMP/rcl.jks" >> "$GITHUB_ENV"
          fi

      - name: 打包
        env:
          RCL_KEYSTORE_PASSWORD: ${{ secrets.RCL_KEYSTORE_PASSWORD }}
          RCL_KEY_ALIAS: ${{ secrets.RCL_KEY_ALIAS }}
          RCL_KEY_PASSWORD: ${{ secrets.RCL_KEY_PASSWORD }}
        run: scripts/build.sh

      - name: 检查 APK 启动层与架构
        run: python3 scripts/verify-apk.py dist

      - uses: actions/upload-artifact@v7
        with:
          name: RCL-Android
          path: dist/*.apk

  release:
    name: 发布 Release
    if: inputs.release_tag != ''
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: RCL-Android
          path: dist-release
      - name: 创建 Release 并上传 APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          version="${TAG#v}"
          expected="$(grep '^versionName=' android/version.properties | cut -d= -f2)"
          if [ "$version" != "$expected" ]; then
            echo "发布版本号 $TAG 与 android/version.properties 中的 $expected 不一致" >&2
            exit 1
          fi
          apk="RCL_Android_${version}_arm64.apk"
          mv dist-release/*.apk "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes=".github/release-notes/${TAG}.md"
          [ -f "$notes" ] || notes=/dev/null
          # 0.x 版本标记为预发布
          pre=""
          case "$TAG" in v0.*) pre="--prerelease" ;; esac
          gh release create "$TAG" "$apk" SHA256SUMS.txt --target "$GITHUB_SHA" --title "RCL 手机版 ${TAG}" --notes-file "$notes" $pre
